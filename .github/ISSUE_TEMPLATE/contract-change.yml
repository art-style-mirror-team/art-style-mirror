name: 계약 변경 제안
description: contracts/interfaces.md의 함수 이름·입출력 형식을 바꾸자는 제안 (팀 합의 필요)
title: "[계약] "
labels: ["infra"]
body:
  - type: markdown
    attributes:
      value: |
        `contracts/interfaces.md`는 팀 합의 없이 바꾸지 않는다(AGENTS.md 규칙 2).
        이 이슈에서 영향받는 담당자 전원이 동의한 뒤, 계약 변경만 담은 별도 PR을 올린다.
  - type: input
    id: function
    attributes:
      label: 바꿀 함수
      placeholder: "예: fuse(p_clip, p_cv) -> list[tuple]"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 바꿔야 하는 이유와 지금 형식의 제약
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 현재 형식 / 제안 형식
      description: 인자·반환 형식을 코드 블록으로 나란히 적는다
      render: python
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향받는 모듈·담당자와 테스트 계획
      description: "예: B classify.fuse() 반환 변경 → D explain.assess_confidence() 수정, tests/test_smoke.py 갱신"
    validations:
      required: true
  - type: checkboxes
    id: agree
    attributes:
      label: 합의
      options:
        - label: 영향받는 담당자 전원이 이 이슈에 동의 댓글을 남겼다
