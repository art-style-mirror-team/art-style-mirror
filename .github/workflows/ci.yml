name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Linux에서 PyPI의 torch는 CUDA 포함판(수 GB)이므로 CPU판을 먼저 설치한다.
      # requirements.txt의 torch==2.15.0은 2.15.0+cpu로 충족된다.
      - name: Install CPU torch
        run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
